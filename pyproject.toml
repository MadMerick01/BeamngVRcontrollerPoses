[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamng-vr-controller-poses"
version = "0.1.0"
description = "OpenXR API layer support and BeamNG Lua bridge for controller poses"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
steamvr = ["openvr>=1.26"]
test = ["pytest>=8"]

[project.scripts]
beamng-vr-poses-openvr-fallback = "beamng_vr_poses.provider:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
