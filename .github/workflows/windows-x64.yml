name: Windows x64 layer
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish releases for v* tags

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Acquire official OpenXR SDK source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --branch release-1.1.41 https://github.com/KhronosGroup/OpenXR-SDK-Source.git "$env:RUNNER_TEMP\OpenXR-SDK-Source"
          if ($LASTEXITCODE -ne 0) { throw "OpenXR SDK clone failed with exit code $LASTEXITCODE" }
          cmake -S "$env:RUNNER_TEMP\OpenXR-SDK-Source" -B "$env:RUNNER_TEMP\openxr-build" -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=OFF -DBUILD_API_LAYERS=OFF -DBUILD_LOADER=ON -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP\openxr-install"
          if ($LASTEXITCODE -ne 0) { throw "OpenXR SDK configuration failed with exit code $LASTEXITCODE" }
          cmake --build "$env:RUNNER_TEMP\openxr-build" --config Release --target install
          if ($LASTEXITCODE -ne 0) { throw "OpenXR SDK build/install failed with exit code $LASTEXITCODE" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Configure and build x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S openxr-layer -B openxr-layer/build/windows-x64 -G "Visual Studio 17 2022" -A x64 -DOpenXR_DIR="$env:RUNNER_TEMP\openxr-install\cmake" -DCMAKE_INSTALL_PREFIX="$pwd\openxr-layer\dist"
          if ($LASTEXITCODE -ne 0) { throw "Layer configuration failed with exit code $LASTEXITCODE" }
          cmake --build openxr-layer/build/windows-x64 --config Release --clean-first
          if ($LASTEXITCODE -ne 0) { throw "Layer build failed with exit code $LASTEXITCODE" }
          cmake --install openxr-layer/build/windows-x64 --config Release
          if ($LASTEXITCODE -ne 0) { throw "Layer install failed with exit code $LASTEXITCODE" }
      - name: Run Lua tests (LuaJIT via lupa)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check pytest==8.3.5 lupa==2.8
          if ($LASTEXITCODE -ne 0) { throw "pytest installation failed with exit code $LASTEXITCODE" }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed with exit code $LASTEXITCODE" }
      - name: Verify PE, export, manifest, and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dist=Resolve-Path openxr-layer/dist
          $dll=Join-Path $dist BeamNGVRPosesLayer.dll
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe was not found"
          }
          $vsInstall = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vsInstall) {
            throw "Visual Studio C++ installation could not be located"
          }
          $dumpbin = Get-ChildItem `
            -Path (Join-Path $vsInstall 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') `
            -File |
            Sort-Object FullName |
            Select-Object -Last 1
          if (!$dumpbin) {
            throw "64-bit dumpbin.exe could not be located"
          }
          $headers=& $dumpbin.FullName /headers $dll | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dumpbin header inspection failed with exit code $LASTEXITCODE" }
          if($headers -notmatch '8664 machine \(x64\)'){throw 'DLL is not an x64 PE image'}
          $exports=& $dumpbin.FullName /exports $dll | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dumpbin export inspection failed with exit code $LASTEXITCODE" }
          if($exports -notmatch 'xrNegotiateLoaderApiLayerInterface'){throw 'Negotiation export missing'}
          $manifest=Get-Content (Join-Path $dist XR_APILAYER_BEAMNG_controller_poses.json) -Raw | ConvertFrom-Json
          $library=[IO.Path]::GetFileName(($manifest.api_layer.library_path -replace '\\','/'))
          if($library -ne 'BeamNGVRPosesLayer.dll' -or !(Test-Path (Join-Path $dist $library))){throw 'Manifest library_path mismatch'}
          $package=Join-Path $pwd package
          New-Item $package -ItemType Directory | Out-Null
          Copy-Item "$dist\*" $package
          New-Item (Join-Path $package scripts) -ItemType Directory | Out-Null
          Copy-Item openxr-layer/scripts/*.ps1 (Join-Path $package scripts)
          Copy-Item openxr-layer/scripts/*.cmd $package
          Copy-Item README.md $package
          # Mod zips need forward-slash entry names, so build them with Python.
          python -c "import sys,zipfile,pathlib;src=pathlib.Path(sys.argv[1]);z=zipfile.ZipFile(sys.argv[2],'w',zipfile.ZIP_DEFLATED);[z.write(f,f.relative_to(src).as_posix()) for f in sorted(src.rglob('*')) if f.is_file()];z.close()" mod (Join-Path $package vrControllerPoses.zip)
          if ($LASTEXITCODE -ne 0) { throw "Mod zip failed" }
          python -c "import sys,zipfile,pathlib;src=pathlib.Path(sys.argv[1]);z=zipfile.ZipFile(sys.argv[2],'w',zipfile.ZIP_DEFLATED);[z.write(f,f.relative_to(src).as_posix()) for f in sorted(src.rglob('*')) if f.is_file()];z.close()" tools/vrPoseDump (Join-Path $package vrPoseDump.zip)
          if ($LASTEXITCODE -ne 0) { throw "Dump tool zip failed" }
          Get-ChildItem $package -File -Recurse | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path.Substring($package.Length+1))" } | Set-Content (Join-Path $package SHA256SUMS.txt)
          Compress-Archive "$package\*" BeamNGVRcontrollerPoses-windows-x64.zip
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: BeamNGVRcontrollerPoses-windows-x64
          path: BeamNGVRcontrollerPoses-windows-x64.zip
          if-no-files-found: error
      - name: Publish GitHub release
        # Tag push v*: release that tag. Push to main: release v3.0.<run>.
        # Manual run (Actions tab, any branch): pre-release v3.0.<run>-beta.
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') {
            $tag = "v3.0.${{ github.run_number }}"
            if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $tag += '-beta' }
          }
          $notes = @"
          **Install:** download ``BeamNGVRcontrollerPoses-windows-x64.zip``, extract it anywhere, double-click ``Install.cmd`` and accept the admin prompt. Then start BeamNG and turn on VR; the pistol appears on your right controller.

          **Uninstall:** double-click ``Uninstall.cmd`` from the same folder.
          "@
          $flags = @('--title', "BeamNG VR controller poses $tag", '--notes', $notes)
          if ($tag -match '-') { $flags += '--prerelease' }
          gh release create $tag BeamNGVRcontrollerPoses-windows-x64.zip --target '${{ github.sha }}' @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
